<VirtualHost *:80>
    ServerName localhost

    # The project root is the document root, not public/. That is how this app
    # is deployed on its cPanel host: index.php sits at the root, .htaccess
    # sits at the root, and views reference assets as
    # asset('resources/assets/...'), which only resolves from here.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Serving the project root means application internals are otherwise
    # reachable over HTTP. Block them explicitly.
    <DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|old|storage|tests|vendor|update|adminemail|email)(/|$)">
        Require all denied
    </DirectoryMatch>

    <DirectoryMatch "^/var/www/html/resources/(views|lang)(/|$)">
        Require all denied
    </DirectoryMatch>

    # .env, .env.docker, .gitattributes, and friends.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Scoped to the root so asset JSON (plugin locales, etc.) still serves.
    <Files "composer.json">
        Require all denied
    </Files>
    <Files "composer.lock">
        Require all denied
    </Files>
    <Files "package.json">
        Require all denied
    </Files>
    <FilesMatch "\.(sql|log)$">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
