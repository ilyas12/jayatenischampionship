; Local development settings. Errors go to the container log rather than into
; the HTML response, so a stray notice from this PHP 5.6-era codebase does not
; corrupt JSON responses or break layouts.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

date.timezone = Asia/Jakarta

memory_limit = 512M
max_execution_time = 120

; The CMS uploads product/gallery images.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

; Opcache off so edits on the bind mount take effect immediately.
opcache.enable = 0
