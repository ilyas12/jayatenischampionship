; Production PHP settings. Paired with the `production` stage in the Dockerfile.
;
; The important differences from docker/php/php.ini (development) are that
; errors never reach the browser and opcache is on.

; Never render errors into a response. A leaked stack trace on this app would
; expose database credentials and absolute paths.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

date.timezone = Asia/Jakarta

memory_limit = 256M
max_execution_time = 60

; The CMS uploads product/gallery images.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 50

; Opcache on, and validate_timestamps off because the code is baked into the
; image — it cannot change without a new container, so there is nothing to
; re-stat on each request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Do not advertise the PHP version in response headers.
expose_php = Off
